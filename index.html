<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الشخبطة الذكية | io.com.ly</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.8);
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            cursor: crosshair;
        }

        .bg-white { background: #ffffff; }
        .bg-lined { 
            background: #ffffff;
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 100% 30px;
        }
        .bg-grid { 
            background: #ffffff;
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px), linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 30px 30px;
        }

        h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 0.5px; }
        .section { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); }
        .flex-group { display: flex; gap: 8px; flex-wrap: wrap; }
        
        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            background: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input[type="color"] { height: 40px; padding: 2px; cursor: pointer; }
        
        .btn-tool { width: auto; flex: 1; min-width: 60px; cursor: pointer; background: #30363d; transition: 0.2s; }
        .btn-tool:hover, .btn-tool.active { background: var(--accent-color); color: #000; font-weight: bold; }
        
        .btn-action { background: #238636; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        .btn-action:hover { background: #2ea043; }
        
        .output-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 400px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
            display: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>منصة io.com.ly</h2>
        <hr style="border-color: var(--border-color); width: 100%;">

        <div class="section">
            <h3>🔑 إعدادات الاتصال</h3>
            <input type="password" id="apiKey" placeholder="أدخل مفتاح Groq API الخاص بك" style="margin-bottom: 8px;">
            <select id="modelSelect">
                <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile (الأقوى تحليلياً)</option>
                <option value="llama-3.1-8b-instant">llama-3.1-8b-instant (الأسرع استجابة)</option>
                <option value="deepseek-r1-distill-llama-70b">deepseek-r1-distill-llama-70b (استدلال عميق)</option>
            </select>
        </div>

        <div class="section">
            <h3>🖌️ أدوات الرسم والأقلام</h3>
            <div class="flex-group" style="margin-bottom: 8px;">
                <button class="btn-tool active" id="tool-pen" onclick="setTool('pen')">قلم</button>
                <button class="btn-tool" id="tool-eraser" onclick="setTool('eraser')">ممحاة</button>
            </div>
            <label style="font-size: 12px; display:block; margin-bottom: 5px;">سمك الخط:</label>
            <input type="range" id="lineWidth" min="1" max="20" value="5" style="padding:0;">
        </div>

        <div class="section">
            <h3>🎨 الألوان والخلفية</h3>
            <input type="color" id="colorPicker" value="#000000" style="margin-bottom: 8px;">
            <select id="bgSelect" onchange="changeBackground(this.value)">
                <option value="bg-white">خلفية بيضاء صافية</option>
                <option value="bg-lined">خلفية أسطر مخططة</option>
                <option value="bg-grid">خلفية هندسية (شبكة)</option>
            </select>
        </div>

        <div class="section">
            <h3>⚙️ إجراءات اللوحة</h3>
            <div class="flex-group">
                <button class="btn-tool" onclick="undo()">تراجع</button>
                <button class="btn-tool" onclick="clearCanvas()" style="background: #da3637; color: white;">مسح الكل</button>
            </div>
        </div>

        <div class="section">
            <h3>🤖 معالجة الرسم بالذكاء الاصطناعي</h3>
            <select id="actionSelect" style="margin-bottom: 8px;">
                <option value="convert_code">تحويل الشخبطة إلى كود HTML/CSS كامل</option>
                <option value="optimize">تنفيذ الفكرة برمجياً وجعلها عالية الجودة</option>
            </select>
            <textarea id="promptInput" rows="3" placeholder="اكتب مطلبة إضافية هنا لتوجيه العمل الفعلي مباشرة..." style="resize: none;"></textarea>
            <button class="btn-action" onclick="processWithAI()">تحويل وتعديل الشخبطة ⚡</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="paintCanvas"></canvas>
    </div>

    <div class="output-box" id="resultBox">
        <h3 style="display: flex; justify-content: space-between;">
            <span>النتيجة البرمجية المباشرة للعمل</span>
            <span style="cursor:pointer; color: #da3637;" onclick="document.getElementById('resultBox').style.display='none'">✕</span>
        </h3>
        <textarea id="aiOutput" rows="15" style="font-family: monospace; font-size: 12px; background: #161b22; width:100%;" readonly></textarea>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let currentTool = 'pen';
        let restoreArray = [];
        let index = -1;

        function resizeCanvas() {
            canvas.width = window.innerWidth - 320;
            canvas.height = window.innerHeight;
            clearCanvas();
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => {
            resizeCanvas();
            saveState();
        });

        // الحصول على الإحداثيات الصحيحة والدقيقة للفأرة أو اللمس داخل اللوحة مباشرة دون إزاحة
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!drawing) return;
            const pos = getMousePos(e);
            ctx.lineWidth = document.getElementById('lineWidth').value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = (currentTool === 'eraser') ? '#ffffff' : document.getElementById('colorPicker').value;
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        });

        canvas.addEventListener('mouseup', () => { if (drawing) { ctx.closePath(); drawing = false; saveState(); } });
        canvas.addEventListener('mouseout', () => { if (drawing) { ctx.closePath(); drawing = false; saveState(); } });

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('tool-pen').classList.remove('active');
            document.getElementById('tool-eraser').classList.remove('active');
            document.getElementById(`tool-${tool}`).classList.add('active');
        }

        function changeBackground(className) {
            canvas.className = '';
            canvas.classList.add(className);
        }

        function clearCanvas() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (drawing) saveState();
        }

        function saveState() {
            index++;
            if (index < restoreArray.length) { restoreArray.length = index; }
            restoreArray.push(canvas.toDataURL());
        }

        function undo() {
            if (index <= 0) {
                clearCanvas();
                index = -1;
                restoreArray = [];
            } else {
                index--;
                let canvasPic = new Image();
                canvasPic.src = restoreArray[index];
                canvasPic.onload = function () { 
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(canvasPic, 0, 0); 
                }
            }
        }

        async function processWithAI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelSelect').value;
            const action = document.getElementById('actionSelect').value;
            const userPrompt = document.getElementById('promptInput').value.trim();
            const outputBox = document.getElementById('resultBox');
            const outputArea = document.getElementById('aiOutput');

            if (!apiKey) {
                alert('الرجاء إدخال مفتاح Groq API الخاص بك أولاً.');
                return;
            }

            outputBox.style.display = 'block';
            outputArea.value = 'جاري المعالجة البرمجية الصارمة وتحويل الشخبطة...';

            let systemInstruction = "أنت محرك برمجيات ومطور فرونت إيند صارم. ممنوع الشرح والحديث الجانبي نهائياً. ";
            if (action === 'convert_code') {
                systemInstruction += "قم بتحويل فكرة الشخبطة الموصوفة فوراً إلى كود HTML/CSS كامل ونظيف داخل صندوق كود دون كتابة أي كلمة خارج الصندوق.";
            } else {
                systemInstruction += "مهمتك تنفيذ الفكرة برمجياً وجعلها عالية الجودة فوراً وإعطاء الأكواد أو البنية البرمجية المحسنة مباشرة بدون مقدمات أو تفسيرات تفصيلية.";
            }

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: "system", content: systemInstruction },
                            { role: "user", content: `توجيه المستخدم: ${userPrompt}. قم بالعمل البرمجي المباشر بناءً عليه وعلى الشخبطة الموصوفة.` }
                        ],
                        temperature: 0.1
                    })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    outputArea.value = data.choices[0].message.content;
                } else {
                    outputArea.value = 'خطأ في الاستجابة: ' + JSON.stringify(data);
                }
            } catch (error) {
                outputArea.value = 'فشل الاتصال: ' + error.message;
            }
        }
    </script>
</body>
</html>
